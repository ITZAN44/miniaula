openapi: 3.0.3
info:
  title: MiniAula API
  version: 1.0.0
  description: |
    API REST de MiniAula, una plataforma de cursos cortos con lecciones y cuestionarios.

    Las rutas protegidas usan un token JWT que se obtiene en `POST /auth/login`.
    Para probarlas aquí, inicia sesión, copia el `token` y pégalo en el botón **Authorize**.

    Todos los errores tienen el mismo formato: `{ "error": { "code", "message", "details" } }`.
servers:
  - url: /api

tags:
  - name: Salud
  - name: Autenticación
  - name: Perfil
  - name: Catálogo
    description: Cursos publicados, se pueden ver sin iniciar sesión
  - name: Inscripciones
  - name: Aula
    description: Avance del estudiante, lecciones y cuestionarios
  - name: Instructor
    description: Gestión de cursos, lecciones, preguntas y métricas del curso

paths:
  /health:
    get:
      tags: [Salud]
      summary: Comprobar que la API está activa
      responses:
        '200':
          description: La API responde
          content:
            application/json:
              example: { status: ok }

  /auth/register:
    post:
      tags: [Autenticación]
      summary: Registrar un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, email, password, rol]
              properties:
                nombre: { type: string, maxLength: 100, example: Juan Pérez }
                email: { type: string, format: email, example: juan.perez@miniaula.com }
                password: { type: string, minLength: 8, example: password123 }
                rol: { type: string, enum: [estudiante, instructor] }
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/Validacion' }
        '409':
          description: El email ya está registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: CONFLICT, message: El registro ya existe, details: null } }

  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      description: Después de 10 intentos fallidos en 15 minutos se bloquea temporalmente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: juan.perez@miniaula.com }
                password: { type: string, example: password123 }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  usuario: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401':
          description: Email o contraseña incorrectos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: UNAUTHORIZED, message: Email o contraseña incorrectos, details: null } }
        '429':
          description: Demasiados intentos fallidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /users/me:
    get:
      tags: [Perfil]
      summary: Ver el perfil del usuario actual
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Datos del usuario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    put:
      tags: [Perfil]
      summary: Editar nombre o email
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Hay que enviar al menos uno de los dos campos
              properties:
                nombre: { type: string, maxLength: 100 }
                email: { type: string, format: email }
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '409':
          description: El email ya lo usa otra cuenta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /cursos:
    get:
      tags: [Catálogo]
      summary: Listar cursos publicados
      description: Ordenados del más nuevo al más viejo.
      parameters:
        - { name: q, in: query, description: Texto a buscar en el título, schema: { type: string, maxLength: 150 } }
        - { name: categoria, in: query, schema: { type: string, maxLength: 50 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 9 } }
      responses:
        '200':
          description: Página de cursos
          content:
            application/json:
              schema:
                type: object
                properties:
                  cursos:
                    type: array
                    items: { $ref: '#/components/schemas/CursoCatalogo' }
                  paginacion: { $ref: '#/components/schemas/Paginacion' }
        '400': { $ref: '#/components/responses/Validacion' }

    post:
      tags: [Instructor]
      summary: Crear un curso en borrador
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, descripcion, categoria, nivel]
              properties:
                titulo: { type: string, maxLength: 150, example: JavaScript Moderno }
                descripcion: { type: string, example: Curso práctico de ES6+, asincronía y módulos. }
                categoria: { type: string, maxLength: 50, example: Programación }
                nivel: { type: string, enum: [basico, intermedio, avanzado], example: basico }
      responses:
        '201':
          description: Curso creado en borrador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CursoInstructor' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /cursos/categorias:
    get:
      tags: [Catálogo]
      summary: Listar las categorías de los cursos publicados
      responses:
        '200':
          description: Categorías sin repetir
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
              example: [Diseño, Idiomas, Programación]

  /cursos/{id}:
    get:
      tags: [Catálogo]
      summary: Ver el detalle de un curso publicado
      description: Incluye el temario, sin el contenido de las lecciones.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Curso con su temario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetalleCurso' }
        '400': { $ref: '#/components/responses/Validacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

    put:
      tags: [Instructor]
      summary: Editar un curso propio
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Enviar al menos un campo para actualizar
              properties:
                titulo: { type: string, maxLength: 150 }
                descripcion: { type: string }
                categoria: { type: string, maxLength: 50 }
                nivel: { type: string, enum: [basico, intermedio, avanzado] }
      responses:
        '200':
          description: Curso actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CursoInstructor' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

    delete:
      tags: [Instructor]
      summary: Eliminar un curso sin estudiantes inscritos
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Curso eliminado
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422':
          description: El curso tiene estudiantes inscritos y solo se puede archivar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: UNPROCESSABLE_ENTITY, message: Un curso con estudiantes inscritos no se puede eliminar, solo archivar, details: null } }

  /cursos/{id}/estado:
    patch:
      tags: [Instructor]
      summary: Publicar o archivar un curso
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [publicado, archivado] }
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CursoInstructor' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422':
          description: No se puede publicar un curso sin lecciones
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: UNPROCESSABLE_ENTITY, message: No se puede publicar un curso sin al menos una lección, details: null } }

  /cursos/{id}/lecciones:
    post:
      tags: [Instructor]
      summary: Crear una lección en un curso
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, tipo]
              properties:
                titulo: { type: string, maxLength: 150, example: Variables y Tipos }
                tipo: { type: string, enum: [contenido, cuestionario] }
                contenido: { type: string, nullable: true }
                videoUrl: { type: string, nullable: true, example: https://www.youtube.com/watch?v=dQw4w9WgXcQ }
                notaMinima: { type: integer, minimum: 1, maximum: 100, nullable: true, description: Obligatoria si tipo es cuestionario }
      responses:
        '201':
          description: Lección creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeccionInstructor' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /cursos/{id}/lecciones/orden:
    patch:
      tags: [Instructor]
      summary: Reordenar las lecciones de un curso
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orden]
              properties:
                orden:
                  type: array
                  minItems: 1
                  items: { type: integer, minimum: 1 }
                  example: [2, 1, 3]
      responses:
        '200':
          description: Lecciones reordenadas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LeccionInstructor' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422':
          description: La lista no coincide con las lecciones del curso

  /cursos/{id}/inscripcion:
    post:
      tags: [Inscripciones]
      summary: Inscribirse en un curso
      description: Solo para estudiantes y solo en cursos publicados.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201':
          description: Inscripción creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inscripcion' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: El estudiante ya está inscrito
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: CONFLICT, message: Ya estás inscrito en este curso, details: null } }

  /inscripciones/mias:
    get:
      tags: [Inscripciones]
      summary: Listar mis cursos con su avance
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Inscripciones del estudiante actual
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InscripcionConAvance' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /cursos/{id}/progreso:
    get:
      tags: [Aula]
      summary: Ver el avance en un curso
      description: |
        Una lección queda `bloqueada` mientras alguna de las anteriores no esté completada.
        Solo puede verlo el estudiante inscrito.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Avance por lección
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Progreso' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /lecciones/{id}:
    get:
      tags: [Aula]
      summary: Abrir una lección
      description: |
        Devuelve el contenido y el avance del estudiante. Si es un cuestionario incluye las preguntas,
        nunca la respuesta correcta.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Lección con el avance del estudiante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Leccion' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Bloqueada' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

    put:
      tags: [Instructor]
      summary: Editar una lección
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Enviar al menos un campo para actualizar
              properties:
                titulo: { type: string, maxLength: 150 }
                contenido: { type: string, nullable: true }
                videoUrl: { type: string, nullable: true }
                notaMinima: { type: integer, minimum: 1, maximum: 100, nullable: true }
      responses:
        '200':
          description: Lección actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeccionInstructor' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

    delete:
      tags: [Instructor]
      summary: Eliminar una lección
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Lección eliminada
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /lecciones/{id}/preguntas:
    get:
      tags: [Instructor]
      summary: Listar preguntas de un cuestionario
      description: Incluye el índice de la respuesta correcta para el instructor dueño.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Lista de preguntas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PreguntaInstructor' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422':
          description: La lección no es un cuestionario

    post:
      tags: [Instructor]
      summary: Agregar una pregunta a un cuestionario
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enunciado, opciones, indiceCorrecto]
              properties:
                enunciado: { type: string, example: ¿Cuál keyword declara una constante? }
                opciones:
                  type: array
                  minItems: 2
                  items: { type: string }
                  example: [var, let, const]
                indiceCorrecto: { type: integer, minimum: 0, example: 2 }
      responses:
        '201':
          description: Pregunta creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreguntaInstructor' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422':
          description: La lección no es un cuestionario

  /lecciones/{id}/completar:
    post:
      tags: [Aula]
      summary: Marcar una lección de contenido como completada
      description: Los cuestionarios no se marcan a mano, se completan al aprobarlos.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Lección completada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvanceLeccion' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Bloqueada' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422':
          description: La lección es un cuestionario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: UNPROCESSABLE_ENTITY, message: Un cuestionario se completa aprobándolo, details: null } }

  /lecciones/{id}/intentos:
    post:
      tags: [Aula]
      summary: Rendir un cuestionario
      description: |
        Hay que responder cada pregunta una sola vez. La nota va de 0 a 100 y se aprueba con la nota
        mínima de la lección. Hay 3 intentos y se guarda la mejor nota.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [respuestas]
              properties:
                respuestas:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [preguntaId, opcion]
                    properties:
                      preguntaId: { type: integer, minimum: 1 }
                      opcion: { type: integer, minimum: 0, description: Posición de la opción elegida, empezando en 0 }
            example:
              respuestas:
                - { preguntaId: 1, opcion: 1 }
                - { preguntaId: 2, opcion: 1 }
      responses:
        '201':
          description: Intento registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoIntento' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Bloqueada' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422':
          description: No es un cuestionario, no tiene preguntas o ya se usaron los 3 intentos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: UNPROCESSABLE_ENTITY, message: Ya usaste los 3 intentos de este cuestionario, details: null } }

  /preguntas/{id}:
    put:
      tags: [Instructor]
      summary: Editar una pregunta
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Enviar al menos un campo para actualizar
              properties:
                enunciado: { type: string }
                opciones:
                  type: array
                  minItems: 2
                  items: { type: string }
                indiceCorrecto: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Pregunta actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreguntaInstructor' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

    delete:
      tags: [Instructor]
      summary: Eliminar una pregunta
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Pregunta eliminada
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /instructor/cursos:
    get:
      tags: [Instructor]
      summary: Listar cursos del instructor actual
      description: Incluye cursos en borrador, publicados y archivados con sus lecciones.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Cursos del instructor
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CursoInstructor' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /instructor/cursos/{id}/resumen:
    get:
      tags: [Instructor]
      summary: Ver resumen y métricas de un curso
      description: Devuelve inscritos, progreso promedio, nota promedio, punto de detención y avance por lección.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Resumen del curso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumenCurso' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

  responses:
    Validacion:
      description: Los datos enviados no son válidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: VALIDATION_ERROR
              message: Los datos enviados no son válidos
              details:
                - { campo: body.email, mensaje: El email no es válido }
    NoAutenticado:
      description: Falta el token o no es válido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: UNAUTHORIZED, message: Debes iniciar sesión, details: null } }
    SinPermiso:
      description: El rol no tiene permiso o el estudiante no está inscrito en el curso
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: FORBIDDEN, message: Debes estar inscrito en el curso, details: null } }
    Bloqueada:
      description: No está inscrito en el curso o la lección todavía está bloqueada
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: LECCION_BLOQUEADA, message: Completa las lecciones anteriores para abrir esta, details: null } }
    NoEncontrado:
      description: No existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: NOT_FOUND, message: El curso no existe o no está publicado, details: null } }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              nullable: true
              type: array
              items:
                type: object
                properties:
                  campo: { type: string }
                  mensaje: { type: string }

    Usuario:
      type: object
      properties:
        id: { type: integer, example: 3 }
        nombre: { type: string, example: Juan Pérez }
        email: { type: string, example: juan.perez@miniaula.com }
        rol: { type: string, enum: [estudiante, instructor] }

    InstructorResumido:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string, example: Ana Pérez }

    CursoCatalogo:
      type: object
      properties:
        id: { type: integer }
        titulo: { type: string, example: Node.js desde cero }
        descripcion: { type: string }
        categoria: { type: string, example: Programación }
        nivel: { type: string, enum: [basico, intermedio, avanzado] }
        estado: { type: string, enum: [publicado] }
        instructorId: { type: integer }
        creadoEn: { type: string, format: date-time }
        cantidadLecciones: { type: integer, example: 5 }
        instructor: { $ref: '#/components/schemas/InstructorResumido' }

    Paginacion:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 9 }
        total: { type: integer, example: 3 }
        totalPaginas: { type: integer, example: 1 }

    DetalleCurso:
      type: object
      properties:
        id: { type: integer }
        titulo: { type: string }
        descripcion: { type: string }
        categoria: { type: string }
        nivel: { type: string, enum: [basico, intermedio, avanzado] }
        estado: { type: string, enum: [publicado] }
        instructorId: { type: integer }
        creadoEn: { type: string, format: date-time }
        instructor: { $ref: '#/components/schemas/InstructorResumido' }
        lecciones:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              titulo: { type: string }
              tipo: { type: string, enum: [contenido, cuestionario] }
              orden: { type: integer }

    Inscripcion:
      type: object
      properties:
        id: { type: integer }
        estudianteId: { type: integer }
        cursoId: { type: integer }
        completado: { type: boolean, description: Pasa a true cuando completa todas las lecciones }
        fechaInscripcion: { type: string, format: date-time }

    InscripcionConAvance:
      allOf:
        - $ref: '#/components/schemas/Inscripcion'
        - type: object
          properties:
            curso:
              type: object
              properties:
                id: { type: integer }
                titulo: { type: string }
                categoria: { type: string }
                nivel: { type: string, enum: [basico, intermedio, avanzado] }
                estado: { type: string, enum: [borrador, publicado, archivado] }
                instructor: { $ref: '#/components/schemas/InstructorResumido' }
            completadas: { type: integer, example: 2 }
            total: { type: integer, example: 5 }
            porcentaje: { type: integer, example: 40 }

    Progreso:
      type: object
      properties:
        curso:
          type: object
          properties:
            id: { type: integer }
            titulo: { type: string }
            estado: { type: string, enum: [borrador, publicado, archivado] }
        lecciones:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              titulo: { type: string }
              tipo: { type: string, enum: [contenido, cuestionario] }
              orden: { type: integer }
              notaMinima: { type: integer, nullable: true }
              completada: { type: boolean }
              bloqueada: { type: boolean }
              intentos: { type: integer }
              mejorNota: { type: integer, nullable: true }
        completadas: { type: integer, example: 2 }
        total: { type: integer, example: 5 }
        porcentaje: { type: integer, example: 40 }

    Pregunta:
      type: object
      description: Nunca incluye la respuesta correcta
      properties:
        id: { type: integer }
        enunciado: { type: string, example: ¿Qué método HTTP se usa para crear un recurso? }
        opciones:
          type: array
          items: { type: string }
          example: [GET, POST, PUT, DELETE]
        leccionId: { type: integer }

    Leccion:
      type: object
      properties:
        id: { type: integer }
        titulo: { type: string }
        tipo: { type: string, enum: [contenido, cuestionario] }
        contenido: { type: string, nullable: true }
        videoUrl: { type: string, nullable: true }
        orden: { type: integer }
        notaMinima: { type: integer, nullable: true }
        cursoId: { type: integer }
        completada: { type: boolean }
        intentos: { type: integer }
        mejorNota: { type: integer, nullable: true }
        preguntas:
          type: array
          description: Solo en cuestionarios
          items: { $ref: '#/components/schemas/Pregunta' }
        intentosRestantes: { type: integer, description: Solo en cuestionarios }

    AvanceLeccion:
      type: object
      properties:
        id: { type: integer }
        inscripcionId: { type: integer }
        leccionId: { type: integer }
        completada: { type: boolean }
        intentos: { type: integer }
        actualizadoEn: { type: string, format: date-time }

    ResultadoIntento:
      type: object
      properties:
        nota: { type: integer, example: 50 }
        aprobado: { type: boolean }
        notaMinima: { type: integer, example: 70 }
        correctas: { type: integer, example: 1 }
        total: { type: integer, example: 2 }
        mejorNota: { type: integer, example: 50 }
        intentos: { type: integer, example: 1 }
        intentosRestantes: { type: integer, example: 2 }

    LeccionInstructor:
      type: object
      properties:
        id: { type: integer }
        titulo: { type: string, example: 1. Introducción a Node.js }
        tipo: { type: string, enum: [contenido, cuestionario] }
        contenido: { type: string, nullable: true }
        videoUrl: { type: string, nullable: true }
        orden: { type: integer, example: 1 }
        notaMinima: { type: integer, nullable: true, example: 70 }
        cursoId: { type: integer }

    CursoInstructor:
      type: object
      properties:
        id: { type: integer }
        titulo: { type: string, example: Node.js desde cero }
        descripcion: { type: string }
        categoria: { type: string, example: Programación }
        nivel: { type: string, enum: [basico, intermedio, avanzado] }
        estado: { type: string, enum: [borrador, publicado, archivado] }
        instructorId: { type: integer }
        creadoEn: { type: string, format: date-time }
        lecciones:
          type: array
          items: { $ref: '#/components/schemas/LeccionInstructor' }

    PreguntaInstructor:
      type: object
      properties:
        id: { type: integer }
        enunciado: { type: string, example: ¿Qué método HTTP se usa para crear un recurso? }
        opciones:
          type: array
          items: { type: string }
          example: [GET, POST, PUT, DELETE]
        indiceCorrecto: { type: integer, example: 1 }
        leccionId: { type: integer }

    ResumenCurso:
      type: object
      properties:
        curso:
          type: object
          properties:
            id: { type: integer }
            titulo: { type: string }
            categoria: { type: string }
            nivel: { type: string, enum: [basico, intermedio, avanzado] }
            estado: { type: string, enum: [borrador, publicado, archivado] }
        inscritos: { type: integer, example: 5 }
        progresoPromedio: { type: integer, example: 60 }
        notaPromedio: { type: integer, nullable: true, example: 85 }
        leccionDondeSeDetienen:
          nullable: true
          type: object
          properties:
            id: { type: integer }
            titulo: { type: string }
            orden: { type: integer }
            tipo: { type: string, enum: [contenido, cuestionario] }
            estudiantesDetenidos: { type: integer }
        lecciones:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              titulo: { type: string }
              tipo: { type: string, enum: [contenido, cuestionario] }
              orden: { type: integer }
              completados: { type: integer }
              detenidos: { type: integer }
